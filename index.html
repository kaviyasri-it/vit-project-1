<!DOCTYPE html>
<html>
<head>
    <title>Login Web</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background-color: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

</body>
</html>
